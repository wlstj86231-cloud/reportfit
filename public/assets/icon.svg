<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">과제 제출 도우미 앱 아이콘</title>
  <desc id="desc">Dark rounded app tile with a blueprint grid, a report sheet, and a diagonal blue editing tool.</desc>
  <defs>
    <linearGradient id="tile" x1="18" y1="10" x2="110" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27333a"/>
      <stop offset="0.48" stop-color="#10191c"/>
      <stop offset="1" stop-color="#080c0f"/>
    </linearGradient>
    <linearGradient id="edge" x1="24" y1="12" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7f5ff" stop-opacity="0.72"/>
      <stop offset="0.38" stop-color="#8aa2ad" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="sheet" x1="37" y1="30" x2="91" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5fbff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d6fff0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="toolBlue" x1="55" y1="92" x2="73" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1172d8"/>
      <stop offset="0.42" stop-color="#4ca5ff"/>
      <stop offset="1" stop-color="#d7f3ff"/>
    </linearGradient>
    <linearGradient id="metal" x1="49" y1="25" x2="78" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="0.45" stop-color="#8b9ba8"/>
      <stop offset="1" stop-color="#32404b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <clipPath id="round">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="128" height="128" fill="url(#tile)"/>
    <path d="M20 34h88M20 56h88M20 78h88M20 100h88M34 20v88M56 20v88M78 20v88M100 20v88" fill="none" stroke="#8bb2c4" stroke-width="1.4" stroke-opacity="0.25"/>
    <path d="M1 38c18-11 39-16 63-15 24 2 45 9 63 21V0H0z" fill="#ffffff" opacity="0.07"/>
    <rect x="36" y="27" width="56" height="76" rx="9" fill="url(#sheet)" stroke="#dff9ff" stroke-opacity="0.24" stroke-width="1.5"/>
    <path d="M48 48h27M48 62h32M48 76h20" fill="none" stroke="#eaffff" stroke-linecap="round" stroke-width="4" stroke-opacity="0.55"/>
    <path d="m73 85 7 7 17-22" fill="none" stroke="#22d494" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/>
    <g transform="rotate(-45 64 64)" filter="url(#drop)">
      <rect x="55" y="35" width="18" height="58" rx="9" fill="url(#toolBlue)"/>
      <rect x="58.5" y="39" width="4.5" height="45" rx="2.25" fill="#ffffff" opacity="0.36"/>
      <rect x="54" y="27" width="20" height="15" rx="4" fill="url(#metal)"/>
      <path d="M57 25h14l-4-10h-6z" fill="#c8d7e3"/>
      <path d="M60 16h8" stroke="#465765" stroke-width="3" stroke-linecap="round"/>
      <rect x="55" y="88" width="18" height="12" rx="6" fill="#0b62c1"/>
    </g>
  </g>
  <rect x="2" y="2" width="124" height="124" rx="27" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
